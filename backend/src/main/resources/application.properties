server.port=8080
server.address=0.0.0.0

# Spring Application Name
spring.application.name=digitalhelper-backend

# Default Profile (H2 with MySQL Compatibility for instant run)
spring.datasource.url=jdbc:h2:mem:digitalhelper_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# H2 Console (Disabled in production, enabled in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload (Max 10MB for screenshots)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
digitalhelper.jwt.secret=DigitalHelperSecretKeyMustBeAtLeast256BitsLongForSecureHmacShaSignature2026
digitalhelper.jwt.expiration-ms=86400000

# AI Configuration (Configurable external LLM or local smart knowledge engine)
digitalhelper.ai.provider=${AI_PROVIDER:mock}
digitalhelper.ai.api-key=${AI_API_KEY:}
digitalhelper.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
digitalhelper.ai.model=${AI_MODEL:gpt-4o-mini}

# Logging configuration (Prevent sensitive data logging)
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.digitalhelper=INFO
